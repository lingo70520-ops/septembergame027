<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>琳鴿的幸運拉霸機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #fdf6e3;
            background-image: radial-gradient(#fde68a 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .slot-container {
            box-shadow: inset 0 8px 16px rgba(0, 0, 0, 0.1), 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .reel {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        
        .blur-text {
            filter: blur(2px);
            opacity: 0.8;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 4s linear infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 overflow-hidden relative">

    <div class="relative bg-white/90 backdrop-blur-sm p-8 rounded-[2.5rem] shadow-2xl max-w-lg w-full text-center border-4 border-amber-300 z-10">
        
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-3xl md:text-4xl font-black text-amber-600 mb-2 drop-shadow-sm">
                ✨ 向宇宙下訂單 ✨
            </h1>
            <p class="text-lg font-bold text-slate-600">琳鴿的幸運拉霸機 🦜</p>
        </div>

        <!-- Slot Machine Box -->
        <div class="slot-container bg-amber-100/80 p-6 rounded-3xl border-2 border-amber-200 mb-8 flex justify-center gap-3 md:gap-6 relative overflow-hidden">
            <!-- Decorative inner shadow edge -->
            <div class="absolute inset-0 border-t-8 border-amber-900/10 rounded-3xl pointer-events-none"></div>

            <!-- Reel 1 -->
            <div class="w-20 h-28 md:w-24 md:h-32 bg-white rounded-2xl flex items-center justify-center shadow-md border-b-4 border-slate-200 overflow-hidden">
                <div id="reel1" class="reel text-5xl md:text-6xl">🦜</div>
            </div>
            <!-- Reel 2 -->
            <div class="w-20 h-28 md:w-24 md:h-32 bg-white rounded-2xl flex items-center justify-center shadow-md border-b-4 border-slate-200 overflow-hidden">
                <div id="reel2" class="reel text-5xl md:text-6xl">🥜</div>
            </div>
            <!-- Reel 3 -->
            <div class="w-20 h-28 md:w-24 md:h-32 bg-white rounded-2xl flex items-center justify-center shadow-md border-b-4 border-slate-200 overflow-hidden">
                <div id="reel3" class="reel text-5xl md:text-6xl">🍎</div>
            </div>
        </div>

        <!-- Action Button -->
        <button id="spinBtn" class="w-full bg-gradient-to-b from-orange-400 to-amber-500 hover:from-orange-500 hover:to-amber-600 text-white font-bold text-xl py-4 px-8 rounded-full transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] shadow-[0_8px_0_rgb(217,119,6)] hover:shadow-[0_4px_0_rgb(217,119,6)] active:shadow-[0_0px_0_rgb(217,119,6)] active:translate-y-2 mb-6">
            ✨ 啟動幸運能量 ✨
        </button>

        <!-- Message Area -->
        <div id="messageBox" class="min-h-[80px] flex items-center justify-center p-4 bg-amber-50 rounded-2xl border-2 border-dashed border-amber-300">
            <p class="text-lg font-bold text-amber-700">準備好向宇宙發送願望了嗎？<br>點擊上方按鈕開始！</p>
        </div>
    </div>

    <!-- Music Toggle Group -->
    <div class="fixed bottom-6 right-6 z-50 flex items-center gap-2 group">
        <span id="musicTooltip" class="text-sm font-bold text-amber-700 bg-white/90 px-3 py-1 rounded-full shadow-md opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap pointer-events-none">
            播放背景音樂 🎵
        </span>
        <button id="musicToggleBtn" class="w-14 h-14 bg-white/90 backdrop-blur-sm rounded-full shadow-[0_4px_15px_rgba(0,0,0,0.15)] flex items-center justify-center text-3xl border-4 border-amber-300 hover:bg-amber-100 transition-all duration-300 hover:scale-110 focus:outline-none animate-bounce">
            <span id="musicIcon" class="inline-block transition-transform duration-300">🔇</span>
        </button>
    </div>

    <script>
        // Game configuration
        const symbols = ['🦜', '🥜', '🍎', '✨'];
        const reels = [
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3')
        ];
        const spinBtn = document.getElementById('spinBtn');
        const messageBox = document.getElementById('messageBox');
        
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const musicIcon = document.getElementById('musicIcon');
        const musicTooltip = document.getElementById('musicTooltip');
        let isMusicPlaying = false;
        let musicSequence = null;
        let synth = null;
        let sfxSynth = null; // 新增：用於播放轉輪音效

        let isSpinning = false;

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.classList.add('opacity-80', 'pointer-events-none');
            spinBtn.innerHTML = '宇宙連線中... 🌌';
            
            // Clear previous message and show loading text
            messageBox.innerHTML = '<p class="text-lg font-bold text-slate-500 animate-pulse">能量滾動中...</p>';

            // Determine final results
            const finalResults = [
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)]
            ];

            // Spin animation logic
            reels.forEach((reel, index) => {
                reel.classList.add('blur-text');
                
                // Rapidly change emojis to simulate spinning
                const spinInterval = setInterval(() => {
                    reel.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                    // Slight vertical bounce effect during spin
                    reel.style.transform = `translateY(${Math.random() * 10 - 5}px)`;
                    
                    // 播放轉動音效
                    if (isMusicPlaying && sfxSynth) {
                        // 依照不同轉輪給予稍微不同的音高
                        const notes = ["C6", "E6", "G6"];
                        sfxSynth.triggerAttackRelease(notes[index], "64n");
                    }
                }, 50);

                // Stop each reel sequentially (Reel 1 at 1s, Reel 2 at 1.5s, Reel 3 at 2s)
                setTimeout(() => {
                    clearInterval(spinInterval);
                    reel.classList.remove('blur-text');
                    reel.style.transform = 'translateY(0)';
                    reel.innerText = finalResults[index];
                    
                    // Add a little stop bounce
                    reel.classList.add('animate-pop');
                    setTimeout(() => reel.classList.remove('animate-pop'), 500);

                    // When the last reel stops, check the result
                    if (index === reels.length - 1) {
                        checkResult(finalResults);
                        resetButton();
                    }
                }, 1000 + (index * 500));
            });
        });

        function checkResult(results) {
            const isWin = (results[0] === results[1] && results[1] === results[2]);
            
            if (isWin) {
                // Jackpot!
                messageBox.innerHTML = `
                    <div class="animate-pop">
                        <p class="text-xl md:text-2xl font-black text-rose-500 mb-1">🎉 太棒了！🎉</p>
                        <p class="text-lg font-bold text-rose-600">宇宙接收到訂單，<br>琳鴿獲得滿滿的堅果大獎！🥜</p>
                    </div>
                `;
                messageBox.classList.replace('bg-amber-50', 'bg-rose-50');
                messageBox.classList.replace('border-amber-300', 'border-rose-400');
                fireConfetti();
            } else {
                // Try again
                messageBox.innerHTML = `
                    <div class="animate-pop flex items-center justify-center gap-3">
                        <span class="text-3xl">🦜</span>
                        <p class="text-lg font-bold text-amber-700 text-left">
                            呱！幸運能量還在累積，<br>再試一次吧！
                        </p>
                    </div>
                `;
                messageBox.classList.replace('bg-rose-50', 'bg-amber-50');
                messageBox.classList.replace('border-rose-400', 'border-amber-300');
            }
        }

        function resetButton() {
            isSpinning = false;
            spinBtn.classList.remove('opacity-80', 'pointer-events-none');
            spinBtn.innerHTML = '✨ 啟動幸運能量 ✨';
        }

        // Initialize the synthesizer and sequence only when the user first clicks the gear
        // This is required by browsers to prevent auto-playing audio
        async function setupMusic() {
            if (synth) return; // Already setup

            await Tone.start();
            
            // Create a cute, pluck-like synth
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.05, decay: 0.1, sustain: 0.3, release: 1 }
            }).toDestination();
            
            // Set master volume a bit lower
            synth.volume.value = -12;

            // 建立音效專用的合成器
            sfxSynth = new Tone.Synth({
                oscillator: { type: "square" },
                envelope: { attack: 0.01, decay: 0.05, sustain: 0, release: 0.01 }
            }).toDestination();
            sfxSynth.volume.value = -20; // 音效音量調小一點

            // A simple, happy looping melody
            const melody = [
                { time: "0:0:0", note: "C4", duration: "8n" },
                { time: "0:0:2", note: "E4", duration: "8n" },
                { time: "0:1:0", note: "G4", duration: "8n" },
                { time: "0:1:2", note: "C5", duration: "4n" },
                { time: "0:2:2", note: "G4", duration: "8n" },
                { time: "0:3:0", note: "E4", duration: "4n" },
                
                { time: "1:0:0", note: "F4", duration: "8n" },
                { time: "1:0:2", note: "A4", duration: "8n" },
                { time: "1:1:0", note: "C5", duration: "8n" },
                { time: "1:1:2", note: "F5", duration: "4n" },
                { time: "1:2:2", note: "C5", duration: "8n" },
                { time: "1:3:0", note: "A4", duration: "4n" }
            ];

            musicSequence = new Tone.Part((time, value) => {
                synth.triggerAttackRelease(value.note, value.duration, time);
            }, melody);
            
            musicSequence.loop = true;
            musicSequence.loopEnd = "2m"; // 2 measures long
            Tone.Transport.bpm.value = 120;
        }

        musicToggleBtn.addEventListener('click', async () => {
            // Remove bounce animation after first click so it doesn't distract the player
            musicToggleBtn.classList.remove('animate-bounce');

            // First time setup
            if (!synth) {
                await setupMusic();
            }

            if (isMusicPlaying) {
                // Stop Music
                Tone.Transport.stop();
                isMusicPlaying = false;
                musicIcon.innerText = '🔇';
                musicToggleBtn.classList.remove('border-green-400');
                musicToggleBtn.classList.add('border-amber-300');
                musicTooltip.innerText = '播放背景音樂 🎵';
            } else {
                // Play Music
                Tone.Transport.start();
                musicSequence.start(0);
                isMusicPlaying = true;
                musicIcon.innerText = '🔊';
                musicToggleBtn.classList.remove('border-amber-300');
                musicToggleBtn.classList.add('border-green-400');
                musicTooltip.innerText = '暫停音樂 🔇';
            }
        });

        // Simple Confetti Effect without external libraries
        function fireConfetti() {
            const colors = ['#fde047', '#f97316', '#ef4444', '#22c55e', '#3b82f6'];
            for (let i = 0; i < 50; i++) {
                createParticle(colors[Math.floor(Math.random() * colors.length)]);
            }
        }

        function createParticle(color) {
            const particle = document.createElement('div');
            document.body.appendChild(particle);
            
            const size = Math.random() * 10 + 5;
            const startX = window.innerWidth / 2;
            const startY = window.innerHeight / 2;
            
            particle.style.position = 'fixed';
            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.backgroundColor = color;
            particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            particle.style.zIndex = '9999';
            particle.style.pointerEvents = 'none';

            // Animation physics
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 15 + 5;
            let vx = Math.cos(angle) * velocity;
            let vy = Math.sin(angle) * velocity - 5; // initial upward burst
            let opacity = 1;

            const gravity = 0.5;

            function animateParticle() {
                vy += gravity; // Apply gravity
                
                let currentLeft = parseFloat(particle.style.left);
                let currentTop = parseFloat(particle.style.top);
                
                particle.style.left = (currentLeft + vx) + 'px';
                particle.style.top = (currentTop + vy) + 'px';
                particle.style.transform = `rotate(${currentTop}deg)`;
                
                opacity -= 0.02;
                particle.style.opacity = opacity;

                if (opacity > 0 && currentTop < window.innerHeight) {
                    requestAnimationFrame(animateParticle);
                } else {
                    particle.remove();
                }
            }
            requestAnimationFrame(animateParticle);
        }
    </script>
</body>
</html>
